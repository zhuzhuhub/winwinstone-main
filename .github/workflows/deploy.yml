name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: zhuzhu19870718-6100s-projects
      VERCEL_PROJECT_ID: winwinstonecustom
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          
      - name: Run build script
        run: node scripts/build-static-site.js
        
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
        
      - name: Debug - Check Vercel CLI version
        run: vercel --version
        
      - name: Debug - Verify token
        run: vercel whoami
        
      - name: Debug - List environment variables
        run: |
          echo "VERCEL_ORG_ID: $VERCEL_ORG_ID"
          echo "VERCEL_PROJECT_ID: $VERCEL_PROJECT_ID"
        
      - name: Deploy to Vercel
        run: vercel --prod --yes --org $VERCEL_ORG_ID --project $VERCEL_PROJECT_ID
